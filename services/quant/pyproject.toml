[project]
name = "bybit-quant"
version = "0.1.0"
description = "Verified market features and observations; no trading or training yet"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema==4.26.0"]

[project.scripts]
bybit-quant = "bybit_quant.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100
