[project]
name = "bybit-quant"
version = "0.1.0"
description = "Verified features, simulation and bounded CPU RL training; no exchange orders"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema==4.26.0", "gymnasium==1.2.1", "numpy==2.3.4", "torch==2.8.0+cpu", "stable-baselines3==2.7.0", "sb3-contrib==2.7.0", "psutil==7.1.0"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
bybit-quant = "bybit_quant.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100
